models:
  - name: stg_jaffle_shop__customers
    description: Grain for this table is 1 unique customer per row
    columns:
      - name: customer_id
        description: This is the primary key of customers table
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: The first name of the customer.
        data_tests:
          - not_null
      - name: last_name
        description: The last name of the customer.
        data_tests:
          - not_null
  - name: stg_jaffle_shop__orders
    description: This has order per row
    columns:
      - name: order_id
        description: This is the primary key for orders table
        data_tests:
          - unique
          - not_null
      - name: status
        data_tests:
           - accepted_values:
              values: 
                - completed
                - shipped
                - placed
                - return_pending 
                - returned
      - name: customer_id
        data_tests:
          - relationships:
              to: ref('stg_jaffle_shop__customers')
              field: customer_id